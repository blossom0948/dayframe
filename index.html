<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="사진 한 장으로 하루를 남기는 로컬 우선 사진 일기, 하루한컷 Dayframe" />
    <title>하루한컷 · Dayframe</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <aside class="sidebar" aria-label="주 메뉴">
        <a class="brand" href="#calendar" aria-label="하루한컷 홈">
          <span class="brand-mark">df</span>
          <span><strong>dayframe</strong><small>하루한컷</small></span>
        </a>

        <div class="profile-card">
          <div class="profile-avatar">나</div>
          <div>
            <strong>나의 하루</strong>
            <span>사진으로 남기는 기록</span>
          </div>
        </div>

        <nav class="desktop-nav" id="desktop-nav">
          <button class="nav-item is-active" data-view="calendar"><span class="nav-icon">▦</span><span>달력</span></button>
          <button class="nav-item" data-view="feed"><span class="nav-icon">▤</span><span>피드</span></button>
          <button class="nav-item nav-add" data-action="new-entry"><span class="nav-icon">＋</span><span>기록하기</span></button>
          <button class="nav-item" data-view="stats"><span class="nav-icon">◔</span><span>통계</span></button>
          <button class="nav-item" data-view="archive"><span class="nav-icon">▱</span><span>보관함</span></button>
        </nav>

        <div class="sidebar-footer">
          <span class="privacy-dot"></span>
          <span>기록은 이 브라우저에만 저장돼요</span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-copy">
            <span class="eyebrow">DAYFRAME · PHOTO JOURNAL</span>
            <h1 id="page-title">이번 달의 장면</h1>
          </div>
          <div class="topbar-actions">
            <label class="search-box" aria-label="기록 검색">
              <span aria-hidden="true">⌕</span>
              <input id="search-input" type="search" placeholder="기록 검색" autocomplete="off" />
            </label>
            <button class="icon-button" data-action="toggle-theme" aria-label="테마 변경" title="테마 변경">◐</button>
            <button class="primary-button compact" data-action="new-entry"><span>＋</span> 기록하기</button>
          </div>
        </header>

        <section id="view-root" class="view-root" aria-live="polite"></section>

        <nav class="mobile-nav" id="mobile-nav" aria-label="하단 메뉴">
          <button class="nav-item is-active" data-view="calendar"><span class="nav-icon">▦</span><span>달력</span></button>
          <button class="nav-item" data-view="feed"><span class="nav-icon">▤</span><span>피드</span></button>
          <button class="nav-item nav-add" data-action="new-entry"><span class="nav-icon">＋</span><span>추가</span></button>
          <button class="nav-item" data-view="stats"><span class="nav-icon">◔</span><span>통계</span></button>
          <button class="nav-item" data-view="archive"><span class="nav-icon">▱</span><span>보관함</span></button>
        </nav>
      </main>
    </div>

    <div id="modal-root"></div>
    <input id="photo-input" type="file" accept="image/*" hidden />
    <input id="import-input" type="file" accept="application/json" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
